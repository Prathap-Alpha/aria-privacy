<body><main><h1>ARIA Personal</h1>
<p>ARIA is a private desktop assistant used by one person, on his own computer. It is not offered to the public and has no other users.</p>
<p>It signs in to its owner's own Google account so it can read his mail and calendar and switch his own smart-home devices when he asks.</p>
